# Sanitized example for ~/.codex/config.toml — environment-variable references only.
# Do not paste real tokens into this file or into ~/.codex/config.toml.
# See ../mcp-tooling.md for setup and authentication instructions.

[mcp_servers.github]
url = "https://api.githubcopilot.com/mcp/"
bearer_token_env_var = "GITHUB_PAT_TOKEN"
required = false

[mcp_servers.context7]
url = "https://mcp.context7.com/mcp"
env_http_headers = { CONTEXT7_API_KEY = "CONTEXT7_API_KEY" }
required = false

[mcp_servers.playwright]
command = "npx"
args = ["@playwright/mcp@0.0.78"]
startup_timeout_sec = 30
tool_timeout_sec = 120
required = false

[mcp_servers.huggingface]
url = "https://huggingface.co/mcp"
bearer_token_env_var = "HF_TOKEN"
required = false
