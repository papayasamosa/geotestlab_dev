[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "geotestlab"
version = "0.1.0"
description = "Build statistically balanced test and control groups for geo-testing — no coding required."
readme = "README.md"
requires-python = ">=3.11,<3.12"
# License: TBD — undecided, see discussion in PR #1
authors = [
    {name = "GeoTestLab Contributors"},
]

dependencies = [
    "streamlit>=1.28",
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.2",
    "scipy>=1.10",
    "altair>=5",
    "plotly>=5",
    "openpyxl>=3.1",
    "python-calamine>=0.1",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
bayesian = [
    "pymc>=5.10,<6",
    "arviz>=0.16,<1",
]
dev = [
    "pytest>=7",
    "pytest-cov>=4",
    "ruff>=0.1",
    "hypothesis>=6",
    "pip-tools>=7,<8",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = [
    "E501",    # line-too-long — widespread pre-existing, would touch every file
    "UP006",   # non-pep585-annotation — pre-existing, would change many type hints
    "UP035",   # deprecated-import — pre-existing, would change imports
    "F841",    # unused-variable — needs logic review per-variable
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # allow assert in tests

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "smoke: marks startup smoke tests",
]
filterwarnings = [
    "ignore::DeprecationWarning:altair.*:",
    "ignore::FutureWarning:sklearn.*:",
    "ignore::UserWarning:openpyxl.*:",
]
