name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (3.11)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip check

      - name: Check formatting with Ruff
        run: ruff format --check .

      - name: Lint with Ruff
        run: ruff check .

      - name: Test with coverage
        run: pytest --cov=. --cov-report=term-missing -q -m "not slow"

      - name: Log environment
        if: always()
        run: python -m pip freeze

  locks:
    name: locks (3.11)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip check

      - name: Verify lock reproducibility
        run: python scripts/compile_requirements.py --check

      - name: Generate lock diagnostics on failure
        if: failure()
        run: |
          mkdir -p lock-diagnostics
          python -m piptools compile --extra=bayesian --strip-extras --annotation-style=line --no-emit-index-url --no-emit-options --no-emit-trusted-host --output-file=lock-diagnostics/requirements.txt pyproject.toml
          python -m piptools compile --extra=bayesian --extra=dev --strip-extras --annotation-style=line --no-emit-index-url --no-emit-options --no-emit-trusted-host --output-file=lock-diagnostics/requirements-dev.txt pyproject.toml
          diff -u requirements.txt lock-diagnostics/requirements.txt > lock-diagnostics/requirements.txt.diff || true
          diff -u requirements-dev.txt lock-diagnostics/requirements-dev.txt > lock-diagnostics/requirements-dev.txt.diff || true

      - name: Upload lock diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lock-diagnostics
          path: lock-diagnostics/
          if-no-files-found: ignore
