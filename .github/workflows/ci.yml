name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (3.11)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip check

      - name: Check formatting with Ruff
        run: ruff format --check .

      - name: Lint with Ruff
        run: ruff check .

      - name: Test with coverage (package gate)
        run: pytest --cov=geotestlab --cov-report=term-missing --cov-fail-under=90 -q -m "not slow"

      - name: Report geotestmatch.py coverage (informational)
        run: pytest --cov=geotestmatch --cov-report=term-missing -q -m "not slow"

      - name: Log environment
        if: always()
        run: python -m pip freeze

  locks:
    name: locks (3.11)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          # pip-tools 7.6.0 (pinned in requirements-dev.txt) imports
          # pip._internal.utils.compat.stdlib_pkgs, which pip >=26.2 removed.
          # Pin pip below that so the lock check keeps reproducing the
          # committed locks instead of failing on tooling drift.
          python -m pip install --upgrade "pip<26.2"
          python -m pip install -r requirements-dev.txt
          python -m pip check

      - name: Verify lock reproducibility
        run: python scripts/compile_requirements.py --check --diagnostics-dir lock-diagnostics

      - name: Upload lock diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lock-diagnostics
          path: lock-diagnostics/
          if-no-files-found: ignore

  numerical:
    name: numerical (3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip check

      - name: Run numerical golden regressions
        run: pytest tests/test_numerical_characterisation.py -q -m slow

  bayesian-smoke:
    name: bayesian-smoke (3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip check

      # Real reduced-sampling PyMC sampling path (draws=20/tune=10/chains=1).
      # Treat this as an execution-path smoke test, not evidence of production
      # MCMC convergence. The app-level trace-creation AppTest exercises the
      # full UI path (match -> evaluate -> Bayesian run) with the same tiny
      # sampling profile.
      - name: Run reduced-sampling Bayesian smoke
        run: |
          pytest tests/test_bayesian_core.py::TestReducedSamplingSmoke -q
          pytest tests/test_bayesian_state_app.py::TestBayesianTraceCreation -q

  # Review-completeness merge gate: fails when an unresolved, non-outdated
  # review thread on the PR carries a P1 or P2 marker. Resolved threads,
  # outdated threads and lower-priority (P3+/no-marker) threads never block.
  # Least-privilege: read-only pull-requests/issues scopes. The same logic is
  # also available as a tested maintainer-side script
  # (scripts/check_review_gate.py) that the automatic merge workflow MUST run
  # before merging, so a P1/P2 arriving after the last CI run is still caught.
  review-gate:
    name: review-gate
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run review completeness gate
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/check_review_gate.py \
            --repo "${{ github.repository }}" \
            --pr "${{ github.event.pull_request.number }}"

      - name: Skip review gate (non-PR event)
        if: github.event_name != 'pull_request'
        run: 'echo "review-gate: not a pull_request event; skipping."'
